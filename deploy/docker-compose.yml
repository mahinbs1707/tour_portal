name: tour-portal

services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tourportal}
      POSTGRES_USER: ${POSTGRES_USER:-tourportal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # Postgres 18+ expects the volume at /var/lib/postgresql (not .../data)
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ../backend
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Dhaka}
      MEDIA_ROOT: ${MEDIA_ROOT:-/media}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
    volumes:
      - media_data:/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ../frontend
    volumes:
      - frontend_static:/shared
    restart: "no"

  nginx:
    image: nginx:1.28.0-alpine
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_static:/usr/share/nginx/html:ro
      - media_data:/var/www/media:ro
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  frontend_static:
