server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # Exact reserved prefixes — $http_host keeps published host:port; never SPA try_files
    location = /api {
        return 301 $scheme://$http_host/api/;
    }
    location = /media {
        return 301 $scheme://$http_host/media/;
    }
    location = /django-admin {
        return 301 $scheme://$http_host/django-admin/;
    }

    # Reserved API namespace — never SPA-fallback
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Django admin — never SPA-fallback
    location /django-admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Media volume — never SPA-fallback
    location /media/ {
        alias /var/www/media/;
        autoindex off;
        try_files $uri =404;
    }

    # SPA static assets with client-side fallback for non-reserved paths only
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
